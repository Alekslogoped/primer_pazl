<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Математические пазлы</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf6ee;color:#33433b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #bf692e;outline-offset:4px}button:disabled{cursor:default}.app{max-width:960px;margin:auto;padding:24px 20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 22px}.modes{display:flex;gap:5px;padding:5px;background:#eaece2;border-radius:15px;flex-wrap:wrap}.modes button{padding:10px 13px;border:0;border-radius:11px;background:transparent;color:#46564b;font-weight:700}.modes button[aria-pressed=true]{background:#3e6952;color:white;box-shadow:0 3px 8px #36574120}.picture-label{display:flex;align-items:center;gap:8px;font-size:14px}.picture-label select{border:1px solid #cbd3c6;border-radius:10px;background:#fffdf8;padding:10px;color:#33433b;max-width:160px}.play{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}.panel-title{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 12px;font-size:16px}.count{font-size:13px;color:#657369;font-weight:500}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));aspect-ratio:1;gap:5px;padding:7px;border:2px solid #dae2d2;background:#e6ebde;border-radius:22px;overflow:hidden;position:relative}.cell,.piece{border:0;background-color:#fffdf7;background-size:300% 300%;background-repeat:no-repeat;min-width:0;position:relative}.cell{border-radius:9px;font-size:clamp(21px,4vw,34px);font-weight:800;color:#3e5c49;box-shadow:0 2px 1px #6e8d6910;transition:background-color .18s,transform .18s}.cell.open{border-radius:3px;box-shadow:none}.cell.active:not(.open){box-shadow:inset 0 0 0 3px #d8a349}.cell.over{background-color:#d6e9c6}.cell.wrong{animation:shake .3s;background-color:#fce2d5}.cell.open::after{content:'✓';position:absolute;right:5px;bottom:5px;font-size:12px;background:#fff9;color:#345b3e;border-radius:20px;width:19px;height:19px;display:grid;place-items:center}.board.complete{gap:0;padding:0;border-color:#8cac6c}.board.complete .cell{border-radius:0}.board.complete .cell:after{display:none}.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.piece{aspect-ratio:1;border-radius:13px;box-shadow:0 3px 0 #cdd8c7,0 5px 10px #3552370d;touch-action:manipulation;transition:transform .15s,opacity .15s}.piece:hover:not(:disabled){transform:translateY(-3px)}.piece.selected{outline:4px solid #ce873e;outline-offset:2px;transform:translateY(-3px)}.piece.used{opacity:.17;box-shadow:none;filter:grayscale(1)}.number{position:absolute;left:6px;top:6px;display:grid;place-items:center;background:#fffdf5;color:#354c38;border:2px solid #fff;border-radius:50%;width:34px;height:34px;font-size:22px;font-weight:850;box-shadow:0 2px 4px #38552c22}.piece.used .number{font-size:16px}.instruction{font-size:13px;line-height:1.6;color:#69766b;margin:14px 0}.progress{height:7px;margin:14px 2px;background:#e2e7d8;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#7f9c5b;transition:width .3s}.bottom{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.action{border:1px solid #d6dfcf;border-radius:12px;padding:11px 15px;background:#fffdf7;color:#455e47;font-weight:700;font-size:14px}.primary{background:#3e6952;color:white;border-color:#3e6952}.status{min-height:26px;margin:12px 0 0;font-weight:650;font-size:15px}.hint{margin-top:12px;padding:14px;background:#f1ead7;border-radius:14px}.hint[hidden],.finish[hidden]{display:none}.hint-title{font-size:14px;margin:0 0 8px}.dotline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dots{display:flex;gap:5px;flex-wrap:wrap;max-width:235px}.dot{display:inline-block;width:16px;height:16px;background:#6c965e;border-radius:50%;position:relative}.dot.other{background:#c78349}.dot.cross{background:#b8bdac}.dot.cross:after{content:'';position:absolute;width:22px;height:2px;background:#9b4939;left:-3px;top:7px;transform:rotate(-45deg)}.zero{font-size:14px}.finish{margin-top:14px;padding:17px;border-radius:16px;background:#e6edda;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.finish strong{display:block;font-size:21px}.finish small{display:block;margin-top:4px;color:#5f7358}.sound{margin-left:auto}button{touch-action:manipulation}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(max-width:650px){.app{padding:20px 14px}.play{grid-template-columns:1fr;gap:20px}.board{max-width:440px;width:100%;margin:auto}.cell{font-size:clamp(25px,7vw,38px)}.tray{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.number{width:28px;height:28px;font-size:18px;left:3px;top:3px}.toolbar{gap:12px}.panel-title{margin-bottom:9px}.instruction{margin:10px 0}.modes button{font-size:13px;padding:10px}.picture-label{width:100%;justify-content:space-between}.picture-label select{max-width:200px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<div class="toolbar">
<div class="modes" role="group" aria-label="Действия"><button data-mode="mix" aria-pressed="true">Всё вместе</button><button data-mode="add" aria-pressed="false">Сложение +</button><button data-mode="sub" aria-pressed="false">Вычитание −</button></div>
<label class="picture-label">Картинка <select id="scene"><option>Лисёнок в лесу</option><option>Зайчик на полянке</option><option>Мишка у ручья</option><option>Котёнок в саду</option><option>Панда в роще</option></select></label>
</div>
<div class="play">
<section><h2 class="panel-title">Поле с примерами <span class="count" id="counter">Собрано 0 из 9</span></h2><div id="board" class="board" aria-label="Поле с примерами"></div><div class="progress" role="progressbar" aria-label="Собрано фрагментов" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0"><span id="bar"></span></div></section>
<section><h2 class="panel-title">Фрагменты с ответами <span class="count">9 деталей</span></h2><div class="tray" id="tray" aria-label="Выбери ответ"></div><p class="instruction">Можно перетащить фрагмент на пример. На телефоне: нажми на фрагмент, затем на пример.</p><div class="bottom"><button class="action" id="help">💡 Подсказка</button><button class="action" id="restart">↻ Заново</button><button class="action sound" id="sound" aria-pressed="false" aria-label="Включить звук">♪ Звук выкл.</button></div><div class="hint" id="hint" hidden></div><p class="status" id="status" role="status" aria-live="polite">Начнём? Выбери любой фрагмент.</p></section>
</div>
<div class="finish" id="finish" hidden><div><strong>Ура! Картинка собрана! ✨</strong><small>Все девять примеров решены.</small></div><button class="action primary" id="next">Следующая картинка →</button></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const board=$('board'),tray=$('tray'),status=$('status');
let mode='mix',tasks=[],order=[],selected=null,active=null,done=new Set(),art='',sound=false,audio;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function expression(answer,type){
 let op=type==='mix'?(Math.random()<.5?'add':'sub'):type;
 if(type==='mix'&&answer===0)op='sub';
 if(type==='mix'&&answer===10)op='add';
 let options=[];
 for(let a=0;a<=10;a++)for(let b=0;b<=10;b++)if((op==='add'?a+b:a-b)===answer)options.push({a,b,op,answer});
 const rich=options.filter(t=>t.a>0&&t.b>0);if(rich.length)options=rich;
 return options[Math.floor(Math.random()*options.length)];
}
function picture(scene){
 const palettes=[['#dfeac2','#a9c67b','#df853c','#fff0ce'],['#e9eccb','#b7c983','#e8d7b7','#fff5df'],['#d9e9d7','#89b68a','#996849','#e8bf8b'],['#f0e8c4','#a4c77e','#dba35c','#ffefcf'],['#dcebcf','#91b77b','#f6f3e6','#fffdf3']];
 const [sky,grass,fur,cream]=palettes[scene];
 const ear=scene===1?'<ellipse cx="252" cy="241" rx="30" ry="103" fill="'+fur+'"/><ellipse cx="348" cy="241" rx="30" ry="103" fill="'+fur+'"/><ellipse cx="252" cy="231" rx="12" ry="67" fill="#e8b4a5"/><ellipse cx="348" cy="231" rx="12" ry="67" fill="#e8b4a5"/>':scene===2||scene===4?'<circle cx="224" cy="281" r="40" fill="'+(scene===4?'#424d47':fur)+'"/><circle cx="376" cy="281" r="40" fill="'+(scene===4?'#424d47':fur)+'"/>':'<path d="M211 312 L208 228 L284 283 M316 283 L392 228 L389 312" fill="'+fur+'"/><path d="M225 281 L222 252 L253 280 M347 280 L378 252 L375 281" fill="#e9b49a"/>';
 const patches=scene===4?'<ellipse cx="260" cy="326" rx="23" ry="29" fill="#424d47" transform="rotate(24 260 326)"/><ellipse cx="340" cy="326" rx="23" ry="29" fill="#424d47" transform="rotate(-24 340 326)"/>':'';
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><rect width="600" height="600" fill="${sky}"/><circle cx="473" cy="95" r="43" fill="#f8d16c"/><g fill="#fff9e8"><ellipse cx="153" cy="106" rx="70" ry="23"/><ellipse cx="180" cy="89" rx="33" ry="27"/><ellipse cx="389" cy="163" rx="53" ry="17"/></g><path d="M0 315 Q135 221 300 309 Q446 236 600 312V600H0Z" fill="${grass}"/><path d="M0 472 Q176 388 332 463T600 454V600H0Z" fill="#81aa6e"/><path d="M505 356 Q417 416 473 462 T376 600H580Q577 490 521 467T569 356Z" fill="#b6d8cf"/><path d="M62 84L84 84L103 475L68 475Z" fill="#95694b"/><g fill="#648b59"><circle cx="74" cy="83" r="86"/><circle cx="30" cy="162" r="70"/><circle cx="121" cy="155" r="77"/></g><path d="M531 142L548 142L555 352L535 352Z" fill="#987451"/><g fill="#73965a"><circle cx="541" cy="117" r="68"/><circle cx="497" cy="176" r="57"/><circle cx="586" cy="170" r="63"/></g><ellipse cx="299" cy="522" rx="106" ry="19" fill="#668c57" opacity=".4"/><ellipse cx="300" cy="449" rx="80" ry="90" fill="${fur}"/><ellipse cx="300" cy="457" rx="51" ry="61" fill="${cream}"/>${ear}<ellipse cx="300" cy="329" rx="98" ry="83" fill="${fur}"/><path d="M211 321 Q251 312 300 355 Q348 312 389 321Q374 402 300 407Q225 402 211 321" fill="${cream}"/>${patches}<g fill="#3e463b"><circle cx="260" cy="328" r="8"/><circle cx="340" cy="328" r="8"/><path d="M287 355 Q300 347 313 355Q311 371 300 373Q289 371 287 355"/></g><path d="M300 371V381M300 380Q286 390 278 378M300 380Q314 390 322 378" fill="none" stroke="#654e39" stroke-width="4" stroke-linecap="round"/><ellipse cx="244" cy="353" rx="13" ry="7" fill="#e5a58a"/><ellipse cx="356" cy="353" rx="13" ry="7" fill="#e5a58a"/><ellipse cx="247" cy="516" rx="36" ry="20" fill="${fur}"/><ellipse cx="353" cy="516" rx="36" ry="20" fill="${fur}"/><path d="M237 418 Q195 453 226 477M363 418 Q405 451 377 478" fill="none" stroke="${fur}" stroke-width="29" stroke-linecap="round"/><g><path d="M108 492V542M161 529V560" stroke="#64834e" stroke-width="5"/><path d="M69 491Q109 424 148 491Z" fill="#c96850"/><path d="M132 530Q160 483 188 530Z" fill="#e3bc68"/><g fill="#fff2d6"><circle cx="100" cy="474" r="7"/><circle cx="124" cy="480" r="5"/><circle cx="160" cy="515" r="5"/></g></g><g stroke="#547b4e" stroke-width="3"><path d="M429 524V562M492 531V573M55 551V582"/></g><g fill="#f4d37b"><circle cx="429" cy="518" r="12"/><circle cx="492" cy="525" r="10"/><circle cx="55" cy="546" r="9"/></g><g fill="#c28baf"><ellipse cx="414" cy="240" rx="13" ry="19" transform="rotate(-34 414 240)"/><ellipse cx="437" cy="240" rx="13" ry="19" transform="rotate(34 437 240)"/></g><path d="M425 235V260" stroke="#665343" stroke-width="4" stroke-linecap="round"/></svg>`;
 return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}
function paint(el,i){el.style.backgroundImage=art;el.style.backgroundPosition=`${(i%3)*50}% ${Math.floor(i/3)*50}%`}
function tone(win=false){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();[523,659,...(win?[784,1047]:[])].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.11;o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}}
function render(){
 board.classList.toggle('complete',done.size===9);
 board.replaceChildren();tray.replaceChildren();
 tasks.forEach((t,i)=>{const b=document.createElement('button');b.className='cell'+(done.has(i)?' open':'')+(active===i?' active':'');b.type='button';b.dataset.index=i;b.disabled=done.has(i);b.textContent=done.has(i)?'':`${t.a} ${t.op==='add'?'+':'−'} ${t.b}`;b.setAttribute('aria-label',done.has(i)?'Фрагмент собран':b.textContent);if(done.has(i))paint(b,i);b.onclick=()=>{active=i;if(selected!==null)attempt(selected,i);else{status.textContent='Теперь выбери фрагмент с ответом, затем нажми на этот пример.';render()}};b.ondragover=e=>{if(!done.has(i)){e.preventDefault();b.classList.add('over')}};b.ondragleave=()=>b.classList.remove('over');b.ondrop=e=>{e.preventDefault();b.classList.remove('over');const raw=e.dataTransfer.getData('text/plain');if(raw!=='')attempt(Number(raw),i)};board.append(b)});
 order.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='piece'+(done.has(i)?' used':'')+(selected===i?' selected':'');b.disabled=done.has(i);b.draggable=!done.has(i);b.setAttribute('aria-label',done.has(i)?'Фрагмент использован':`Ответ ${tasks[i].answer}`);b.setAttribute('aria-pressed',String(selected===i));paint(b,i);const n=document.createElement('span');n.className='number';n.textContent=done.has(i)?'✓':tasks[i].answer;b.append(n);b.onclick=()=>{selected=selected===i?null:i;status.textContent=selected===null?'Выбери любой фрагмент.':`Ответ ${tasks[i].answer}. Нажми на подходящий пример.`;render()};b.ondragstart=e=>{selected=i;e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move';status.textContent='Перетащи фрагмент на подходящий пример.'};tray.append(b)});
 $('counter').textContent=`Собрано ${done.size} из 9`;$('bar').style.width=`${done.size/9*100}%`;document.querySelector('.progress').setAttribute('aria-valuenow',String(done.size));$('finish').hidden=done.size!==9;$('help').disabled=done.size===9;
}
function attempt(piece,cell){
 if(!Number.isInteger(piece)||!Number.isInteger(cell)||!tasks[piece]||!tasks[cell]||done.has(piece)||done.has(cell))return;
 active=cell;
 if(tasks[piece].answer===tasks[cell].answer){done.add(cell);selected=null;active=null;$('hint').hidden=true;render();tone(done.size===9);status.textContent=done.size===9?'Отлично! Ты собрал всю картинку!':'Верно! Ещё один фрагмент на месте.'}
 else{selected=null;render();const el=board.children[cell];el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),350);status.textContent='Пока не подходит. Посчитай ещё раз — у тебя получится!'}
}
function start(){done=new Set();selected=null;active=null;tasks=shuffle(Array.from({length:11},(_,i)=>i)).slice(0,9).map(a=>expression(a,mode));order=shuffle(tasks.map((_,i)=>i));art=picture(Number($('scene').value));$('hint').hidden=true;status.textContent='Начнём? Выбери любой фрагмент.';render()}
Array.from($('scene').options).forEach((o,i)=>o.value=String(i));
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));start()});
$('scene').onchange=start;$('restart').onclick=start;$('next').onclick=()=>{$('scene').value=String((Number($('scene').value)+1)%5);start()};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♪ Звук вкл.':'♪ Звук выкл.';$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'Выключить звук':'Включить звук');if(sound)tone()};
$('help').onclick=()=>{
 if(done.size===9)return;if(active===null||done.has(active))active=tasks.findIndex((_,i)=>!done.has(i));const t=tasks[active];render();const h=$('hint');h.replaceChildren();h.hidden=false;
 const title=document.createElement('p');title.className='hint-title';title.textContent=`Посчитай: ${t.a} ${t.op==='add'?'+':'−'} ${t.b}`;h.append(title);
 const row=document.createElement('div');row.className='dotline';
 const dots=(count,other=false,cross=0)=>{const g=document.createElement('span');g.className='dots';g.setAttribute('role','img');g.setAttribute('aria-label',`${count} кружочков${cross?`, зачёркнуто ${cross}`:''}`);if(count===0){g.textContent='0';g.className='zero'}for(let i=0;i<count;i++){const d=document.createElement('span');d.className='dot'+(other?' other':'')+(i>=count-cross?' cross':'');g.append(d)}return g};
 row.append(dots(t.a,false,t.op==='sub'?t.b:0));if(t.op==='add'){const plus=document.createElement('span');plus.textContent='+';row.append(plus,dots(t.b,true))}h.append(row);const text=document.createElement('p');text.className='hint-title';text.style.margin='10px 0 0';text.textContent=t.op==='add'?'Сколько кружочков вместе?':'Сколько кружочков осталось без зачёркивания?';h.append(text);status.textContent='Нужный пример выделен на поле.';
};
start();
})();
</script>
</body>
</html>
