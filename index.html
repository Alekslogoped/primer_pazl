<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Математические пазлы</title>
<link rel="preload" as="image" href="./assets/puzzle-fox-winter.webp">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(48px,8svh,88px) 18px 24px;background:#e9f2fb url("./assets/winter-clearing.webp") center center/cover no-repeat fixed;color:#33433b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #bf692e;outline-offset:4px}button:disabled{cursor:default}.app{width:100%;max-width:960px;margin:0;padding:24px 20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 22px}.modes{display:flex;gap:5px;padding:5px;background:#eaece2;border-radius:15px;flex-wrap:wrap}.modes button{padding:10px 13px;border:0;border-radius:11px;background:transparent;color:#46564b;font-weight:700}.modes button[aria-pressed=true]{background:#3e6952;color:white;box-shadow:0 3px 8px #36574120}.picture-label{display:flex;align-items:center;gap:8px;font-size:14px}.picture-label select{border:1px solid #cbd3c6;border-radius:10px;background:#fffdf8;padding:10px;color:#33433b;max-width:160px}.play{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}.panel-title{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 12px;font-size:16px}.count{font-size:13px;color:#657369;font-weight:500}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));aspect-ratio:1;gap:5px;padding:7px;border:2px solid #dae2d2;background:#e6ebde;border-radius:22px;overflow:hidden;position:relative}.cell,.piece{border:0;background-color:#fffdf7;background-size:300% 300%;background-repeat:no-repeat;min-width:0;position:relative}.cell{border-radius:9px;font-size:clamp(21px,4vw,34px);font-weight:800;color:#3e5c49;box-shadow:0 2px 1px #6e8d6910;transition:background-color .18s,transform .18s}.cell.open{border-radius:3px;box-shadow:none}.cell.active:not(.open){box-shadow:inset 0 0 0 3px #d8a349}.cell.over{background-color:#d6e9c6}.cell.wrong{animation:shake .3s;background-color:#fce2d5}.cell.open::after{content:'✓';position:absolute;right:5px;bottom:5px;font-size:12px;background:#fff9;color:#345b3e;border-radius:20px;width:19px;height:19px;display:grid;place-items:center}.board.complete{gap:0;padding:0;border-color:#8cac6c}.board.complete .cell{border-radius:0}.board.complete .cell:after{display:none}.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.piece{aspect-ratio:1;border-radius:13px;box-shadow:0 3px 0 #cdd8c7,0 5px 10px #3552370d;touch-action:manipulation;transition:transform .15s,opacity .15s}.piece:hover:not(:disabled){transform:translateY(-3px)}.piece.selected{outline:4px solid #ce873e;outline-offset:2px;transform:translateY(-3px)}.piece.used{opacity:.17;box-shadow:none;filter:grayscale(1)}.number{position:absolute;left:6px;top:6px;display:grid;place-items:center;background:#fffdf5;color:#354c38;border:2px solid #fff;border-radius:50%;width:34px;height:34px;font-size:22px;font-weight:850;box-shadow:0 2px 4px #38552c22}.piece.used .number{font-size:16px}.instruction{font-size:13px;line-height:1.6;color:#69766b;margin:14px 0}.bottom{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.action{border:1px solid #d6dfcf;border-radius:12px;padding:11px 15px;background:#fffdf7;color:#455e47;font-weight:700;font-size:14px}.primary{background:#3e6952;color:white;border-color:#3e6952}.status{min-height:26px;margin:12px 0 0;font-weight:650;font-size:15px}.hint{margin-top:12px;padding:14px;background:#f1ead7;border-radius:14px}.hint[hidden],.finish[hidden]{display:none}.hint-title{font-size:14px;margin:0 0 8px}.dotline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dots{display:flex;gap:5px;flex-wrap:wrap;max-width:235px}.dot{display:inline-block;width:16px;height:16px;background:#6c965e;border-radius:50%;position:relative}.dot.other{background:#c78349}.dot.cross{background:#b8bdac}.dot.cross:after{content:'';position:absolute;width:22px;height:2px;background:#9b4939;left:-3px;top:7px;transform:rotate(-45deg)}.zero{font-size:14px}.finish{margin-top:14px;padding:17px;border-radius:16px;background:#e6edda;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.finish strong{display:block;font-size:21px}.finish small{display:block;margin-top:4px;color:#5f7358}.sound{margin-left:auto}button{touch-action:manipulation}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(max-width:650px){body{padding:48px 6px 18px}.app{padding:20px 14px}.play{grid-template-columns:1fr;gap:20px}.board{max-width:440px;width:100%;margin:auto}.cell{font-size:clamp(25px,7vw,38px)}.tray{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.number{width:28px;height:28px;font-size:18px;left:3px;top:3px}.toolbar{gap:12px}.panel-title{margin-bottom:9px}.instruction{margin:10px 0}.modes button{font-size:13px;padding:10px}.picture-label{width:100%;justify-content:space-between}.picture-label select{max-width:200px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Winter example cards */
.board{border-color:#183f74;background:#b8d7ed}
.cell:not(.open){background-color:#c9e5fb;border:2px solid #183f74;color:#163d70;box-shadow:0 2px 0 #183f7518}
.cell.active:not(.open){box-shadow:inset 0 0 0 3px #659bc4}
.cell.over:not(.open){background-color:#a8d1f0}
.cell.wrong:not(.open){background-color:#f5dfe7}
.board.complete{border-color:#183f74}
.number{color:#163d70}

/* Matching blue controls and readable navy lettering */
.modes{background:#c9e5fb}
.modes button,.modes button[aria-pressed=true]{background:#c9e5fb;color:#183f74;box-shadow:none}
.modes button[aria-pressed=true]{box-shadow:inset 0 0 0 2px #183f74}
.action,.primary,.picture-label select{background:#c9e5fb;border-color:#183f74;color:#183f74}
.finish,.hint{background:#c9e5fb}
.finish{border:1px solid #183f74}


body,.modes button,.modes button[aria-pressed=true],.action,.primary,
.picture-label,.picture-label select,.panel-title,.count,.instruction,.status,
.hint-title,.zero,.finish,.finish strong,.finish small,.number,.cell:not(.open){
 color:#183f74;
 -webkit-text-stroke:0;
 text-shadow:none;
}
.picture-label select{font-weight:700}
.picture-label select option{color:#183f74;background:#eff7ff;-webkit-text-stroke:0;text-shadow:none}

/* Larger game on a translucent ice-glass panel */
.game-shell{width:100%;max-width:1200px;overflow:clip;border-radius:32px;box-shadow:0 16px 45px rgba(43,81,126,.18)}
.app{width:100%;max-width:1200px;margin:0;padding:26px;border:1px solid rgba(255,255,255,.9);border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.54),rgba(219,240,255,.24) 55%,rgba(244,251,255,.4));-webkit-backdrop-filter:blur(10px) saturate(115%);backdrop-filter:blur(10px) saturate(115%);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(133,190,228,.6);transform-origin:top left}
.toolbar{gap:12px}
@media(max-width:650px){.game-shell{border-radius:24px}.app{padding:17px 12px;border-radius:24px}.modes{gap:2px}.modes button{padding:10px 8px}}

/* Snow magic appears only when the last piece is placed. */
.snow-magic{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:clip}
.snow-particle{position:absolute;left:var(--left);top:var(--top);width:var(--size);height:var(--size);display:grid;place-items:center;line-height:1;color:#f8fdff;font-size:var(--size);text-shadow:0 0 7px #fff,0 0 15px #6bbcff;opacity:0;will-change:transform,opacity;animation:snow-burst var(--duration) var(--delay) cubic-bezier(.18,.65,.4,1) both}
.snow-particle.dust{border-radius:50%;background:#fff;box-shadow:0 0 8px #a9e5ff}
.board.celebrating{animation:ice-glow 2.8s ease-out}
.board.celebrating::before{content:'';position:absolute;inset:-50%;z-index:2;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.65) 49%,transparent 63%);animation:ice-shimmer 1.4s ease-out both}
@keyframes snow-burst{
 0%{opacity:0;transform:translate3d(0,0,0) scale(.15) rotate(0deg)}
 14%{opacity:1}
 40%{opacity:1;transform:translate3d(var(--spread-x),var(--spread-y),0) scale(1) rotate(var(--turn))}
 100%{opacity:0;transform:translate3d(var(--end-x),var(--end-y),0) scale(.6) rotate(var(--end-turn))}
}
@keyframes ice-glow{0%,100%{box-shadow:0 0 0 rgba(180,232,255,0)}25%{box-shadow:0 0 25px 8px #effcff,0 0 55px 12px #a2daff}65%{box-shadow:0 0 18px 3px #d5f4ff}}
@keyframes ice-shimmer{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
@media(prefers-reduced-motion:reduce){.snow-magic{display:none}}
</style>
</head>
<body>
<div class="game-shell">
<main class="app">
<div class="toolbar">
<div class="modes" role="group" aria-label="Действия"><button data-mode="mix" aria-pressed="true">Всё вместе</button><button data-mode="add" aria-pressed="false">Сложение +</button><button data-mode="sub" aria-pressed="false">Вычитание −</button></div>
<label class="picture-label">Картинка <select id="scene"><option>Лисёнок с санками</option><option>Зайчик и снеговик</option><option>Мишка на лыжах</option><option>Котёнок на катке</option><option>Панда и фонарик</option></select></label>
</div>
<div class="play">
<section><h2 class="panel-title">Поле с примерами <span class="count" id="counter">Собрано 0 из 9</span></h2><div id="board" class="board" aria-label="Поле с примерами"></div></section>
<section><h2 class="panel-title">Фрагменты с ответами <span class="count">9 деталей</span></h2><div class="tray" id="tray" aria-label="Выбери ответ"></div><p class="instruction">Можно перетащить фрагмент на пример. На телефоне: нажми на фрагмент, затем на пример.</p><div class="bottom"><button class="action" id="help">💡 Подсказка</button><button class="action" id="restart">↻ Заново</button><button class="action sound" id="sound" aria-pressed="false" aria-label="Включить звук">♪ Звук выкл.</button></div><div class="hint" id="hint" hidden></div><p class="status" id="status" role="status" aria-live="polite">Начнём? Выбери любой фрагмент.</p></section>
</div>
<div class="finish" id="finish" hidden><div><strong>Ура! Картинка собрана! ✨</strong><small>Все девять примеров решены.</small></div><button class="action primary" id="next">Следующая картинка →</button></div>
</main>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const board=$('board'),tray=$('tray'),status=$('status');
const snowLayer=document.createElement('div');
snowLayer.className='snow-magic';
snowLayer.setAttribute('aria-hidden','true');
document.body.append(snowLayer);
let snowTimer=0,snowFrame=0;
function clearSnow(){
 clearTimeout(snowTimer);cancelAnimationFrame(snowFrame);
 snowLayer.replaceChildren();board.classList.remove('celebrating');
}
function celebrateSnow(){
 clearSnow();
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 snowFrame=requestAnimationFrame(()=>{
  if(done.size!==9)return;
  const rect=board.getBoundingClientRect();
  const centerX=rect.left+rect.width/2,centerY=rect.top+rect.height*.5;
  board.classList.add('celebrating');
  const particles=document.createDocumentFragment();
  for(let i=0;i<72;i++){
   const particle=document.createElement('span');
   const dust=i%3===0,angle=Math.random()*Math.PI*2;
   const radius=rect.width*(.22+Math.random()*.4);
   const spreadX=Math.cos(angle)*radius;
   const spreadY=Math.sin(angle)*radius-rect.height*.16;
   particle.className='snow-particle'+(dust?' dust':'');
   particle.textContent=dust?'':(i%4===0?'✦':'❄');
   const values={
    left:centerX+'px',top:centerY+'px',size:(dust?3+Math.random()*5:14+Math.random()*19)+'px',
    'spread-x':spreadX+'px','spread-y':spreadY+'px',
    'end-x':(spreadX+(Math.random()-.5)*110)+'px',
    'end-y':(spreadY+130+Math.random()*160)+'px',
    turn:((Math.random()-.5)*200)+'deg','end-turn':((Math.random()-.5)*500)+'deg',
    duration:(2600+Math.random()*1000)+'ms',delay:(Math.random()*180)+'ms'
   };
   for(const [name,value] of Object.entries(values))particle.style.setProperty('--'+name,value);
   particles.append(particle);
  }
  snowLayer.append(particles);
  snowTimer=setTimeout(clearSnow,4000);
 });
}
let mode='mix',tasks=[],order=[],selected=null,active=null,done=new Set(),art='',sound=false,audio;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function expression(answer,type){
 let op=type==='mix'?(Math.random()<.5?'add':'sub'):type;
 if(type==='mix'&&answer===0)op='sub';
 if(type==='mix'&&answer===10)op='add';
 let options=[];
 for(let a=0;a<=10;a++)for(let b=0;b<=10;b++)if((op==='add'?a+b:a-b)===answer)options.push({a,b,op,answer});
 const rich=options.filter(t=>t.a>0&&t.b>0);if(rich.length)options=rich;
 return options[Math.floor(Math.random()*options.length)];
}
function picture(scene){
 const paths=["./assets/puzzle-fox-winter.webp","./assets/puzzle-bunny-winter.webp","./assets/puzzle-bear-winter.webp","./assets/puzzle-kitten-winter.webp","./assets/puzzle-panda-winter.webp"];
 return 'url("'+paths[scene]+'")';
}
function paint(el,i){el.style.backgroundImage=art;el.style.backgroundPosition=`${(i%3)*50}% ${Math.floor(i/3)*50}%`}
function tone(win=false){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();[523,659,...(win?[784,1047]:[])].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.11;o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}}
function render(){
 board.classList.toggle('complete',done.size===9);
 board.replaceChildren();tray.replaceChildren();
 tasks.forEach((t,i)=>{const b=document.createElement('button');b.className='cell'+(done.has(i)?' open':'')+(active===i?' active':'');b.type='button';b.dataset.index=i;b.disabled=done.has(i);b.textContent=done.has(i)?'':`${t.a} ${t.op==='add'?'+':'−'} ${t.b}`;b.setAttribute('aria-label',done.has(i)?'Фрагмент собран':b.textContent);if(done.has(i))paint(b,i);b.onclick=()=>{active=i;if(selected!==null)attempt(selected,i);else{status.textContent='Теперь выбери фрагмент с ответом, затем нажми на этот пример.';render()}};b.ondragover=e=>{if(!done.has(i)){e.preventDefault();b.classList.add('over')}};b.ondragleave=()=>b.classList.remove('over');b.ondrop=e=>{e.preventDefault();b.classList.remove('over');const raw=e.dataTransfer.getData('text/plain');if(raw!=='')attempt(Number(raw),i)};board.append(b)});
 order.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='piece'+(done.has(i)?' used':'')+(selected===i?' selected':'');b.disabled=done.has(i);b.draggable=!done.has(i);b.setAttribute('aria-label',done.has(i)?'Фрагмент использован':`Ответ ${tasks[i].answer}`);b.setAttribute('aria-pressed',String(selected===i));paint(b,i);const n=document.createElement('span');n.className='number';n.textContent=done.has(i)?'✓':tasks[i].answer;b.append(n);b.onclick=()=>{selected=selected===i?null:i;status.textContent=selected===null?'Выбери любой фрагмент.':`Ответ ${tasks[i].answer}. Нажми на подходящий пример.`;render()};b.ondragstart=e=>{selected=i;e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move';status.textContent='Перетащи фрагмент на подходящий пример.'};tray.append(b)});
 $('counter').textContent=`Собрано ${done.size} из 9`;$('finish').hidden=done.size!==9;$('help').disabled=done.size===9;
}
function attempt(piece,cell){
 if(!Number.isInteger(piece)||!Number.isInteger(cell)||!tasks[piece]||!tasks[cell]||done.has(piece)||done.has(cell))return;
 active=cell;
 if(tasks[piece].answer===tasks[cell].answer){done.add(cell);selected=null;active=null;$('hint').hidden=true;render();if(done.size===9)celebrateSnow();tone(done.size===9);status.textContent=done.size===9?'Отлично! Ты собрал всю картинку!':'Верно! Ещё один фрагмент на месте.'}
 else{selected=null;render();const el=board.children[cell];el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),350);status.textContent='Пока не подходит. Посчитай ещё раз — у тебя получится!'}
}
function start(){clearSnow();done=new Set();selected=null;active=null;tasks=shuffle(Array.from({length:11},(_,i)=>i)).slice(0,9).map(a=>expression(a,mode));order=shuffle(tasks.map((_,i)=>i));art=picture(Number($('scene').value));$('hint').hidden=true;status.textContent='Начнём? Выбери любой фрагмент.';render()}
Array.from($('scene').options).forEach((o,i)=>o.value=String(i));
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));start()});
$('scene').onchange=start;$('restart').onclick=start;$('next').onclick=()=>{$('scene').value=String((Number($('scene').value)+1)%5);start()};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♪ Звук вкл.':'♪ Звук выкл.';$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'Выключить звук':'Включить звук');if(sound)tone()};
$('help').onclick=()=>{
 if(done.size===9)return;if(active===null||done.has(active))active=tasks.findIndex((_,i)=>!done.has(i));const t=tasks[active];render();const h=$('hint');h.replaceChildren();h.hidden=false;
 const title=document.createElement('p');title.className='hint-title';title.textContent=`Посчитай: ${t.a} ${t.op==='add'?'+':'−'} ${t.b}`;h.append(title);
 const row=document.createElement('div');row.className='dotline';
 const dots=(count,other=false,cross=0)=>{const g=document.createElement('span');g.className='dots';g.setAttribute('role','img');g.setAttribute('aria-label',`${count} кружочков${cross?`, зачёркнуто ${cross}`:''}`);if(count===0){g.textContent='0';g.className='zero'}for(let i=0;i<count;i++){const d=document.createElement('span');d.className='dot'+(other?' other':'')+(i>=count-cross?' cross':'');g.append(d)}return g};
 row.append(dots(t.a,false,t.op==='sub'?t.b:0));if(t.op==='add'){const plus=document.createElement('span');plus.textContent='+';row.append(plus,dots(t.b,true))}h.append(row);const text=document.createElement('p');text.className='hint-title';text.style.margin='10px 0 0';text.textContent=t.op==='add'?'Сколько кружочков вместе?':'Сколько кружочков осталось без зачёркивания?';h.append(text);status.textContent='Нужный пример выделен на поле.';
};
start();

const gameShell=document.querySelector('.game-shell');
const gameApp=document.querySelector('.app');
let fitFrame=0;
function fitGame(){
 cancelAnimationFrame(fitFrame);
 fitFrame=requestAnimationFrame(()=>{
  if(window.innerWidth<900){
   gameShell.style.width='';gameShell.style.height='';gameShell.style.borderRadius='';
   gameApp.style.width='';gameApp.style.maxWidth='';gameApp.style.transform='';
   return;
  }
  const style=getComputedStyle(document.body);
  const availableWidth=Math.max(320,document.documentElement.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight));
  const availableHeight=Math.max(300,window.innerHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom));
  gameApp.style.width='1200px';gameApp.style.maxWidth='none';
  const gameHeight=gameApp.offsetHeight;
  const scale=Math.min(1,availableWidth/1200,availableHeight/gameHeight);
  gameShell.style.width=(1200*scale)+'px';
  gameShell.style.height=(gameHeight*scale)+'px';
  gameShell.style.borderRadius=(32*scale)+'px';
  gameApp.style.transform='scale('+scale+')';
 });
}
new ResizeObserver(fitGame).observe(gameApp);
window.addEventListener('resize',fitGame);
fitGame();

})();
</script>
</body>
</html>
